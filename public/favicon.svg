<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Tech Obsidian / Sanctuary Navy -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="55%" stop-color="#091426" />
      <stop offset="100%" stop-color="#050a14" />
    </radialGradient>

    <!-- Vibrant Neon Cyan/Teal Stroke Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Bars Gradient: Glowing Cyan to Vivid Turquoise -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Refined Neon Glow Filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect x="18" y="18" width="476" height="476" rx="118" fill="url(#bgGlow)" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.28" />

  <!-- Ambient Internal Glow Behind Book -->
  <circle cx="256" cy="245" r="145" fill="#22d3ee" opacity="0.1" />

  <!-- MAIN ICON EMBLEM -->
  <g filter="url(#glow)">
    <!-- OUTER BOOK SPINE & COVERS -->
    <path d="M 256 394 
             C 222 410, 150 405, 96 376 
             C 86 371, 80 361, 80 350 
             L 80 144 
             C 80 133, 89 125, 100 128 
             C 152 144, 222 148, 256 176 
             C 290 148, 360 144, 412 128 
             C 423 125, 432 133, 432 144 
             L 432 350 
             C 432 361, 426 371, 416 376 
             C 362 405, 290 410, 256 394 Z" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- INNER PAGE CONTOUR -->
    <path d="M 256 364 
             C 224 376, 164 372, 118 348 
             L 118 168 
             C 160 182, 220 184, 256 206 
             C 292 184, 352 182, 394 168 
             L 394 348 
             C 348 372, 288 376, 256 364 Z" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="8" 
          stroke-opacity="0.8" 
          stroke-linejoin="round" />

    <!-- CENTRAL SPINE CREASE -->
    <line x1="256" y1="206" x2="256" y2="364" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.6" />

    <!-- 3 ASCENDING PROGRESS & GROWTH BARS -->
    <!-- Bar 1 (Short - 76px) -->
    <rect x="174" y="274" width="38" height="76" rx="9" fill="url(#barGrad)" stroke="#67e8f9" stroke-width="4.5" />
    
    <!-- Bar 2 (Medium - 120px) -->
    <rect x="226" y="230" width="38" height="120" rx="9" fill="url(#barGrad)" stroke="#67e8f9" stroke-width="4.5" />

    <!-- Bar 3 (Tall - 168px) -->
    <rect x="278" y="182" width="38" height="168" rx="9" fill="url(#barGrad)" stroke="#67e8f9" stroke-width="4.5" />

    <!-- DRAFTING COMPASS (Angled ~22°, Prominent & Iconic) -->
    <g transform="translate(352, 185) rotate(-22)">
      <!-- Pivot Ring -->
      <circle cx="0" cy="-28" r="9" fill="none" stroke="#67e8f9" stroke-width="5" />
      <circle cx="0" cy="-28" r="3.5" fill="#a5f3fc" />
      <!-- Left Compass Leg -->
      <line x1="-5" y1="-20" x2="-22" y2="32" stroke="#67e8f9" stroke-width="5.5" stroke-linecap="round" />
      <!-- Right Compass Leg -->
      <line x1="5" y1="-20" x2="22" y2="32" stroke="#67e8f9" stroke-width="5.5" stroke-linecap="round" />
      <!-- Adjustment Arch / Crossbar -->
      <path d="M -14 6 Q 0 11 14 6" fill="none" stroke="#67e8f9" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
